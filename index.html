<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b55">
  <meta name="description" content="A simple grocery shopping list with quantities, prices, budget tracking and offline support.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>My Grocery List</title>
</head>
<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true">🛒</div>
    <div><h1>My Grocery List</h1><p>Simple shopping. Clear spending.</p></div>
    <span id="save-status" class="save-status">Saved</span>
  </header>

  <main class="container">
    <section class="summary panel">
      <div class="budget-row">
        <label for="budget">Shopping budget <span>(R)</span></label>
        <input id="budget" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter budget">
      </div>
      <div class="total-label">Shopping total</div>
      <div class="total" id="total-top">R 0.00</div>
      <div id="budget-message" class="budget-message" aria-live="polite"></div>
      <div id="progress-area">
        <div class="progress-heading"><strong>Shopping progress</strong><span id="progress-count">0 / 0 checked</span></div>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="progress-percent" class="progress-percent">0% completed</div>
      </div>
      <button class="button button-reset" id="reset-top" type="button">↻ Reset Checklist</button>
    </section>

    <section class="panel controls">
      <h2>Sort &amp; filter</h2>
      <div class="control-grid">
        <label>Category
          <select id="category-filter"><option value="all">All Categories</option></select>
        </label>
        <label>Items
          <select id="item-filter">
            <option value="all">All Items</option>
            <option value="checked">Checked Items</option>
            <option value="unchecked">Unchecked Items</option>
          </select>
        </label>
        <label>Sort
          <select id="sort-mode">
            <option value="category">Category</option>
            <option value="az">A–Z (all items)</option>
          </select>
        </label>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <section class="panel bottom-summary">
      <div class="total-label">Shopping total</div>
      <div class="total" id="total-bottom">R 0.00</div>
      <button class="button button-reset" id="reset-bottom" type="button">↻ Reset Checklist</button>
    </section>
    <p class="footnote">Your list is saved on this device and remains available offline after the app has loaded once.</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
